name: Build and Push Docker Image

on:
  push:
    branches:
      - main   # trigger only on main branch

jobs:
  build:
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Checkout code
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # 3. Build Docker image
      - name: Build image
        run: |
          docker build -t ghcr.io/sararashidiyan/my-image:${{ steps.version.outputs.VERSION }} \
          docker build -t ghcr.io/sararashidiyan/my-image:latest \
          .

      # 4. Push Docker image
      - name: Push image
        run: |
          docker push ghcr.io/sararashidiyan/my-image:${{ steps.version.outputs.VERSION }}
          docker push ghcr.io/sararashidiyan/my-image:latest
