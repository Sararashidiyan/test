name: Build and Push Docker Image

on:
  push:
    branches:
      - main   # trigger only on main branch

jobs:
  build:
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2.Log in to GitHub Container Registry 
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
     
      # 3. Build Docker image
      - name: Build image
        run: |
          VERSION=${{ github.run_number }}
          docker build -t ghcr.io/sararashidiyan/my-image:$VERSION .
          docker build -t ghcr.io/sararashidiyan/my-image:latest .

      # 4. Push Docker image
      - name: Push image
        run: |
          VERSION=${{ github.run_number }}
          docker push ghcr.io/sararashidiyan/my-image:$VERSION
          docker push ghcr.io/sararashidiyan/my-image:latest
